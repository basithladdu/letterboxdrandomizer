    <!-- Structured Data (JSON-LD): FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does Letterboxd Watchlist Mixer work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Enter your public Letterboxd username or link. The app reads every film in your public watchlist and uses an authentic retro slot machine roulette to pick a movie for you."
            }
          },
          {
            "@type": "Question",
            "name": "Can I find common films between two Letterboxd watchlists?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. In the Common Films tab, enter two usernames. The app cross-references both watchlists to find shared movies and spins only from films both users want to watch."
            }
          },
          {
            "@type": "Question",
            "name": "How does Group Movie Night work for 3 to 6 friends?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In the Group Movie Night tab, add 3 to 6 Letterboxd usernames. You can choose Unanimous mode (films present on all watchlists) or Majority mode (films shared by 2 or more friends)."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need a Letterboxd account or API key to use this tool?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No account or API key is required. The app only accesses public watchlist data."
            }
          }
        ]
      }
    </script>
